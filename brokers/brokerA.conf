# Mosquitto Broker A Configuration
# Listener configuration (syntax baru, menggantikan 'port')
listener 1883 0.0.0.0
protocol mqtt

# Logging
log_dest stdout
log_type all

# Persistence
persistence true
persistence_location brokers/data/brokerA/

# Allow anonymous connections (untuk development)
allow_anonymous true

# Connection settings
max_connections -1
max_queued_messages 1000

# Keepalive settings
max_keepalive 65535
